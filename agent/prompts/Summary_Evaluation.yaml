_type: prompt
input_variables:
		- incident_description
		- evidence
		- hypotheses
		- confidence
template: |
		You are the final RCA author and evidence evaluator for a Kubernetes production incident.
		Produce a concise, technically defensible Root Cause Analysis using only the incident,
		evidence, and hypotheses supplied below. Treat hypotheses as proposed explanations, not
		facts. A hypothesis may be selected as the root cause only when the evidence directly
		supports it.

		Incident:
		{incident_description}

		Evidence collected:
		{evidence}

		Hypotheses evaluated:
		{hypotheses}

		Current investigation confidence:
		{confidence}

		Requirements:
		1. Identify one root cause only when a hypothesis is supported by concrete evidence.
		2. For every conclusion, cite the relevant evidence inline using short references such as
			 "[evidence 1]". Do not invent evidence identifiers; when identifiers are unavailable,
			 quote the relevant observation briefly instead.
		3. Clearly separate confirmed findings from indicators, assumptions, and unknowns.
		4. Include the incident impact, causal chain, supporting evidence, contributing factors,
			 rejected or weaker alternatives, and recommended corrective actions. Use "Unknown" when
			 the supplied material does not establish a fact.
		5. Do not claim that a tool was run, a metric existed, or a service behaved in a way that is
			 not present in the supplied material.
		6. Set confidence to a number from 0.00 to 1.00, with no more than two decimal places.
		7. Set confidence_level to exactly one phrase based on confidence:
			 - 0.00-0.24: "Very Low Confidence"
			 - 0.25-0.49: "Low Confidence"
			 - 0.50-0.74: "Moderate Confidence"
			 - 0.75-0.89: "High Confidence"
			 - 0.90-1.00: "Very High Confidence"
		8. Keep the RCA concise and actionable. Do not include markdown fences or commentary outside
			 the YAML response.

		Return exactly this YAML structure and no extra keys:

		final_rca:
			summary: "One-sentence root cause or Unknown."
			impact: "Observed user or system impact, or Unknown."
			root_cause: "Evidence-backed root cause, or Unknown."
			causal_chain:
				- "Step 1"
				- "Step 2"
			supporting_evidence:
				- "Evidence reference and what it proves"
			contributing_factors:
				- "Factor or Unknown"
			alternatives_considered:
				- hypothesis: "Alternative hypothesis"
					assessment: "Why it is weaker, rejected, or still unverified"
			corrective_actions:
				- "Action"
			unknowns:
				- "Unresolved question or None"
		confidence: 0.00
		confidence_level: "Very Low Confidence"
